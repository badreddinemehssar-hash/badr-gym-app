function safeLoad(){try{const raw=localStorage.getItem(STORE_KEY);if(raw){const data=JSON.parse(raw);if(data?.schema===1&&Array.isArray(data.sessions)&&Array.isArray(data.logs))return data;}}catch(e){console.warn('Primary data read failed',e)}try{const raw=localStorage.getItem(BACKUP_KEY);if(raw){const data=JSON.parse(raw);if(data?.schema===1&&Array.isArray(data.sessions))return data}}catch(e){}return seed()}
let S=safeLoad(),tab='home',dialog='',progressMode='weight',progressExercise='',historyQuery='',historyType='all',editSessionId='',editExId='',editLogId='',clock={end:0,remaining:0,running:false},restInterval=null,toastHandle=null;
function persist(){try{const old=localStorage.getItem(STORE_KEY);if(old)localStorage.setItem(BACKUP_KEY,old);localStorage.setItem(STORE_KEY,JSON.stringify(S));return true}catch(e){notify('Storage unavailable or full. Export a backup now.',true);console.error(e);return false}}
function notify(message,error=false){const el=document.getElementById('toast');el.textContent=message;el.style.background=error?'#ffb0a8':'';el.classList.add('visible');clearTimeout(toastHandle);toastHandle=setTimeout(()=>{el.classList.remove('visible');el.style.background=''},3200)}
function navigate(next){tab=next;closeDialog();render();window.scrollTo(0,0)}
function button(text,action,style=''){return `<button type="button" class="btn ${style}" onclick="${action}">${text}</button>`}
function navItems(mobile=false){const links=[['home','Overview','home'],['workout','Train','dumbbell'],['plan','Plan','layers'],['progress','Progress','chart'],['history','History','calendar'],['settings','Settings','settings']];const m=mobile?links.filter(x=>x[0]!=='history').map(x=>x[0]==='settings'?x:x):links;return m.map(([id,name,ico])=>`<button class="navbtn ${tab===id?'active':''}" onclick="navigate('${id}')">${icon(ico)}<span>${name}</span></button>`).join('')}
function weekStart(date=new Date()){const d=new Date(date);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setHours(0,0,0,0);return d}
function isCurrentWeek(iso){return new Date(iso+'T12:00:00')>=weekStart()}
function weekLogs(){return S.logs.filter(x=>isCurrentWeek(x.date))}
function exCount(s){return s.exercises?.length||0}
function typeOfLog(l){return l.type||(S.sessions.find(s=>s.id===l.sessionId)?.type)||'gym'}
function sessionsCount(type){return weekLogs().filter(l=>typeOfLog(l)===type).length}
function durationLabel(min){return `${num(min)} min`}
function calcVolume(l){if(typeOfLog(l)!=='gym')return 0;return (l.exercises||[]).reduce((all,e)=>all+(e.sets||[]).reduce((z,s)=>z+(s.done?num(s.weight)*num(s.reps):0),0),0)}
function totalSets(l){return (l.exercises||[]).reduce((z,e)=>z+(e.sets||[]).filter(x=>x.done).length,0)}
function fmtNumber(n){return Math.round(n).toLocaleString('en-BE')}
function exerciseHistory(exname){return S.logs.filter(l=>typeOfLog(l)==='gym').flatMap(l=>(l.exercises||[]).filter(e=>e.name.toLowerCase()===String(exname).toLowerCase()).map(e=>({date:l.date,sets:e.sets}))).sort((a,b)=>b.date.localeCompare(a.date))}
function latestSetStats(exname){const h=exerciseHistory(exname)[0];if(!h)return null;const sets=h.sets.filter(s=>s.done);return {date:h.date,sets,top:Math.max(...sets.map(s=>num(s.weight)),0)}}
function sessionToActive(s){const last=S.logs.filter(x=>x.sessionId===s.id && typeOfLog(x)===s.type).sort((a,b)=>b.date.localeCompare(a.date))[0];return {id:uid(),sessionId:s.id,sessionName:s.title,code:s.code,type:s.type,date:todayISO(),startedAt:Date.now(),notes:'',rpe:'',duration:s.mins,scale:'rx',wod:'',score:'',exercises:s.type==='gym'?(s.exercises||[]).map(e=>{const prev=latestSetStats(e.name);const prevDone=prev?.sets||[];const count=S.profile.reentry?Math.max(2,Math.ceil(e.sets*.65)):e.sets;return {...JSON.parse(JSON.stringify(e)),sets:Array.from({length:count},(_,i)=>({id:uid(),weight:prevDone[i]?.weight??prevDone.at(-1)?.weight??'',reps:'',rir:'',done:false}))}}):[]}}
function begin(id){if(S.active){if(!confirm('A workout is already in progress. Replace it? Your unfinished workout will be lost.'))return;}const s=S.sessions.find(x=>x.id===id);if(!s)return;S.active=sessionToActive(s);persist();navigate('workout');notify(`${s.title} started — autosaving every change`)}
function killActive(){if(!S.active)return;if(!confirm('Discard this unfinished workout?'))return;S.active=null;persist();render();notify('Workout discarded')}
function completedSets(){return (S.active?.exercises||[]).reduce((n,e)=>n+e.sets.filter(x=>x.done).length,0)}
function activeSets(){return (S.active?.exercises||[]).reduce((n,e)=>n+e.sets.length,0)}
function logField(key,v){if(!S.active)return;S.active[key]=v;persist()}
function logSet(exidx,setidx,key,v){const set=S.active?.exercises?.[exidx]?.sets?.[setidx];if(!set)return;set[key]=v;persist()}
function toggleSet(exidx,setidx){const e=S.active.exercises[exidx],set=e.sets[setidx];if(!set.done&&(!Number.isFinite(Number(set.reps))||num(set.reps)<=0)){notify('Enter your reps before marking the set done',true);return;}set.done=!set.done;persist();if(set.done)startRest(e.rest);render()}
function addSet(exidx){const e=S.active?.exercises?.[exidx];if(!e)return;const last=e.sets.at(-1)||{};e.sets.push({id:uid(),weight:last.weight||'',reps:'',rir:'',done:false});persist();render()}
function dropSet(exidx,setidx){const e=S.active.exercises[exidx];if(e.sets.length<=1){notify('Keep at least one set',true);return;}e.sets.splice(setidx,1);persist();render()}
function finish(){if(!S.active)return;if(S.active.type==='gym'&&completedSets()===0){notify('Log at least one completed set',true);return;}if(S.active.type==='crossfit'&&!S.active.wod.trim()&&!S.active.score.trim()){if(!confirm('Save this CrossFit class without a workout or score?'))return;}if(!confirm('Finish and save this workout to your history?'))return;const l=JSON.parse(JSON.stringify(S.active));l.finishedAt=Date.now();l.duration=l.type==='gym'?Math.max(1,Math.round((l.finishedAt-l.startedAt)/60000)):num(l.duration,60);S.logs.push(l);S.active=null;persist();stopRest();navigate('history');notify('Session saved permanently in your history')}
function cancelRest(){clock.running=false;clock.remaining=0;clock.end=0;if(restInterval)clearInterval(restInterval);renderTimer()}
function stopRest(){cancelRest()}
function startRest(seconds){if(!seconds)return;clock={running:true,end:Date.now()+seconds*1000,remaining:seconds};if(restInterval)clearInterval(restInterval);restInterval=setInterval(()=>{if(!clock.running)return;clock.remaining=Math.max(0,Math.ceil((clock.end-Date.now())/1000));if(clock.remaining<=0){cancelRest();notify('Rest finished — next set');try{if('vibrate'in navigator)navigator.vibrate([160,80,160])}catch(e){}}else renderTimer()},250);renderTimer()}
function toggleRest(){if(!clock.running&&clock.remaining>0){clock.running=true;clock.end=Date.now()+clock.remaining*1000}else if(clock.running){clock.remaining=Math.max(0,Math.ceil((clock.end-Date.now())/1000));clock.running=false;}renderTimer()}
function renderTimer(){const root=document.getElementById('timer-root');if(!clock.running&&!clock.remaining){root.innerHTML='';return}const s=clock.remaining;root.innerHTML=`<div class="timer"><div><div class="eyebrow" style="color:#435b38">REST TIMER</div><div class="count">${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}</div></div><span style="flex:1"></span>${button(icon(clock.running?'clock':'play'),"toggleRest()",'sm')}${button(icon('close'),"cancelRest()",'sm')}</div>`}

const l=S.active;let content='';if(l.type==='gym'){content=l.exercises.map((e,i)=>{const done=e.sets.filter(s=>s.done).length;const prev=latestSetStats(e.name);return `<section class="logger-exercise"><div class="ex-head"><div><span class="eyebrow">EXERCISE ${i+1} / ${l.exercises.length} · ${esc(e.muscle)}</span><h3>${esc(e.name)}</h3><div class="ex-info"><span class="pill gray">${esc(e.lo)}–${esc(e.hi)} reps</span><span class="pill gray">${esc(e.rest)}s rest</span><span class="pill ${done===e.sets.length?'green':'gray'}">${done}/${e.sets.length} done</span></div></div><div style="display:grid;gap:7px"><a class="btn sm" href="${esc(safeVideo(e.video,e.name))}" target="_blank" rel="noopener noreferrer">${icon('youtube')} Demo</a>${button('Rest '+Math.round(num(e.rest)/60)+'m',`startRest(${Math.max(10,num(e.rest))})`,'sm')}</div></div><div class="ex-note">${esc(e.note||'Use controlled technique and progress gradually.')}<div class="small muted" style="margin-top:5px">Difficulty: ${esc(e.difficulty||'Intermediate')}${prev?' · Last: '+fmtDate(prev.date)+' · top '+prev.top+' kg':''}</div></div><div class="set-table"><div class="set-line header"><span>SET</span><span>KG</span><span>REPS</span><span>RIR</span><span>DONE</span><span></span></div>${e.sets.map((s,j)=>`<div class="set-line ${s.done?'done':''}"><div class="set-number">${j+1}</div><input aria-label="Weight for set ${j+1}" type="number" min="0" step="0.5" inputmode="decimal" placeholder="kg" value="${esc(s.weight)}" oninput="logSet(${i},${j},'weight',this.value)"><input aria-label="Reps for set ${j+1}" type="number" min="0" step="1" inputmode="numeric" placeholder="reps" value="${esc(s.reps)}" oninput="logSet(${i},${j},'reps',this.value)"><input aria-label="RIR for set ${j+1}" type="number" min="0" max="10" step="1" inputmode="numeric" placeholder="RIR" value="${esc(s.rir)}" oninput="logSet(${i},${j},'rir',this.value)"><button class="set-check" title="Toggle completed" onclick="toggleSet(${i},${j})">${s.done?'✓': return `<div class="header-row"><div><span class="pill green">● AUTOSAVING</span><h2 style="margin-top:13px">${esc(l.sessionName)}</h2><p>${esc(l.code)} · ${l.type==='gym'?'Lift session':'CrossFit'} · ${fmtDate(l.date)}</p></div>${button('Discard',"killActive()",'danger sm')}</div><div class="card" style="margin-bottom:18px"><div class="form-row"><div class="field"><label>Session date</label><input type="date" value="${esc(l.date)}" onchange="logField('date',this.value)"></div><div class="field"><label>${l.type==='gym'?'Session effort (RPE /10)':'Focus'}</label><input ${l.type==='gym'?'type="number" min="1" max="10"':'type="text"'} placeholder="${l.type==='gym'?'Optional':'Optional'}" value="${esc(l.rpe)}" oninput="logField('rpe',this.value)"></div></div></div>${content}<div class="card"><div class="field"><label>Workout notes / how you felt</label><textarea placeholder="Sleep, recovery, pain, improvements, energy…" oninput="logField('notes',this.value)">${esc(l.notes)}</textarea></div></div><div class="sticky-save"><div><strong>${l.type==='gym'?`${completedSets()} / ${activeSets()} sets`:'CrossFit class'}</strong><div class="small muted">All changes auto-saved</div></div>${button(icon('check')+' Finish & save',"finish()",'primary')}</div>`}
function renderPlan(){return `<div class="header-row"><div><div class="eyemark">100% EDITABLE</div><h2>Your V-taper program</h2><p>Built around lat width, shoulder caps, upper chest, strong legs and two CrossFit classes. Reorder, swap, remove or add anything.</p></div>${button(icon('plus')+' New session',"editSession('new')",'primary sm')}</div><div class="guide" style="margin-bottom:18px"><strong>Flexible order:</strong> A → B → C → D when recovery allows, plus two CrossFit classes each week. The D session is optional if you are fatigued. You can rearrange everything; completed workouts retain a snapshot of the exercises you actually performed.</div>${S.sessions.map((s,i)=>`<div class="card" style="margin-bottom:15px"><div class="card-head"><div><div class="eyebrow">${s.type==='gym'?'LIFTING SESSION':'CROSSFIT'} · ${esc(s.code)}</div><h2 style="margin:6px 0 4px">${esc(s.title)}</h2><p class="muted small" style="margin:0">${esc(s.short)}</p></div><div class="chip-list">${button(icon('play'),`begin('${s.id}')`,'sm primary')}${button(icon('edit'),`editSession('${s.id}')`,'sm')}${button(icon('copy'),`duplicateSession('${s.id}')`,'sm')}${button('↑',`moveSession('${s.id}',-1)`,'sm')}${button('↓',`moveSession('${s.id}',1)`,'sm')}</div></div>${s.type==='gym'?`<div style="margin-top:19px">${s.exercises.map((e,j)=>`<div class="plan-ex"><div class="left"><span class="num">${j+1}</span><div style="min-width:0"><strong>${esc(e.name)}</strong><small>${e.sets} × ${e.lo}–${e.hi} reps · ${e.rest}s rest · ${esc(e.muscle)}</small></div></div><div class="actionrow">${button(icon('youtube'),`openTutorial('${s.id}','${e.id}')`,'sm')}${button(icon('edit'),`editExercise('${s.id}','${e.id}')`,'sm')}${button('↑',`moveExercise('${s.id}','${e.id}',-1)`,'sm')}${button('↓',`moveExercise('${s.id}','${e.id}',1)`,'sm')}${button('×',`removeExercise('${s.id}','${e.id}')`,'sm')}</div></div>`).join('')}</div><div style="margin-top:16px">${button(icon('plus')+' Add exercise',`editExercise('${s.id}','new')`,'sm')}</div>`:`<div class="muted small" style="padding:12px 0">Log WOD, result, duration, RX/scaled, effort and notes when you complete each class. No fixed exercises.</div>`}</div>`).join('')}`}
function safeVideo(url,name){try{const u=new URL(url||youtubeSearch(name));if(['https:','http:'].includes(u.protocol)&&(['youtube.com','www.youtube.com','m.youtube.com','youtu.be'].includes(u.hostname)))return u.href}catch(e){}return youtubeSearch(name)}
function openTutorial(sid,eid){const s=S.sessions.find(s=>s.id===sid),e=s?.exercises?.find(e=>e.id===eid);if(e)window.open(safeVideo(e.video,e.name),'_blank','noopener,noreferrer')}
function moveSession(id,direction){const i=S.sessions.findIndex(x=>x.id===id),j=i+direction;if(i<0||j<0||j>=S.sessions.length)return;[S.sessions[i],S.sessions[j]]=[S.sessions[j],S.sessions[i]];persist();render()}
function moveExercise(sid,eid,direction){const s=S.sessions.find(s=>s.id===sid);if(!s)return;const i=s.exercises.findIndex(e=>e.id===eid),j=i+direction;if(i<0||j<0||j>=s.exercises.length)return;[s.exercises[i],s.exercises[j]]=[s.exercises[j],s.exercises[i]];persist();render()}
function duplicateSession(sid){const s=S.sessions.find(x=>x.id===sid);if(!s)return;const copy=JSON.parse(JSON.stringify(s));copy.id=uid();copy.code=s.code+'*';copy.title=s.title+' (copy)';copy.exercises.forEach(e=>e.id=uid());S.sessions.push(copy);persist();render();notify('Session duplicated — customise it in the editor')}
function removeSession(id){const s=S.sessions.find(x=>x.id===id);if(!s)return;if(!confirm('Delete this session from your plan? Past workout history will remain intact.'))return;S.sessions=S.sessions.filter(x=>x.id!==id);persist();render();notify('Session removed; training history preserved')}
function removeExercise(sid,eid){const s=S.sessions.find(x=>x.id===sid);if(!s||!confirm('Remove this exercise from the plan?'))return;s.exercises=s.exercises.filter(x=>x.id!==eid);persist();render()}
function modal(title,body,foot=''){document.getElementById('dialog-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeDialog()" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2 style="margin:0;font-size:23px">${esc(title)}</h2>${button(icon('close'),"closeDialog()",'sm')}</div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`;document.body.style.overflow='hidden'}
function closeDialog(){document.getElementById('dialog-root').innerHTML='';document.body.style.overflow=''}
function editSession(id){editSessionId=id;const s=S.sessions.find(s=>s.id===id)||{code:'NEW',title:'',type:'gym',focus:'',short:'',mins:60};const form=`<form id="edit-session-form" onsubmit="saveSession(event)" style="display:grid;gap:15px"><div class="form-row"><div class="field"><label>Session code</label><input name="code" required maxlength="7" value="${esc(s.code)}"></div><div class="field"><label>Type</label><select name="type"><option value="gym" ${s.type==='gym'?'selected':''}>Gym</option><option value="crossfit" ${s.type==='crossfit'?'selected':''}>CrossFit</option></select></div></div><div class="field"><label>Title</label><input name="title" required maxlength="60" value="${esc(s.title)}" placeholder="New upper session"></div><div class="form-row"><div class="field"><label>Focus label</label><input name="focus" value="${esc(s.focus)}" placeholder="LATS · SHOULDERS"></div><div class="field"><label>Estimated minutes</label><input type="number" name="mins" min="10" max="240" value="${esc(s.mins)}"></div></div><div class="field"><label>Short description</label><textarea name="short" placeholder="What is the goal of this session?">${esc(s.short)}</textarea></div><button type="submit" class="btn primary block">${icon('save')} Save session</button></form>`;
modal(id==='new'?'Add a session':'Edit session',form,id==='new'?'':button(icon('trash')+' Delete this session',`removeSession('${id}');closeDialog()`,'sm danger'));}
function saveSession(ev){ev.preventDefault();const f=new FormData(ev.target);const id=editSessionId;let s=S.sessions.find(s=>s.id===id);if(!s){s={id:uid(),exercises:[]};S.sessions.push(s)}s.code=String(f.get('code')).trim().slice(0,7);s.title=String(f.get('title')).trim().slice(0,60);s.type=String(f.get('type'));s.focus=String(f.get('focus')).trim();s.short=String(f.get('short')).trim();s.mins=clamp(num(f.get('mins'),60),10,240);persist();closeDialog();navigate('plan');notify('Session saved');}
function editExercise(sid,eid){editSessionId=sid;editExId=eid;const s=S.sessions.find(s=>s.id===sid);if(!s)return;const e=s.exercises.find(x=>x.id===eid)||{name:'',sets:3,lo:8,hi:12,rest:90,muscle:'',difficulty:'Intermediate',note:'',video:''};const form=`<form id="edit-ex-form" onsubmit="saveExercise(event)" style="display:grid;gap:15px"><div class="field"><label>Exercise name</label><input name="name" required maxlength="100" value="${esc(e.name)}" placeholder="e.g. Incline dumbbell press"></div><div class="form-row four"><div class="field"><label>Sets</label><input type="number" name="sets" required min="1" max="12" value="${esc(e.sets)}"></div><div class="field"><label>Min reps</label><input type="number" name="lo" required min="1" max="100" value="${esc(e.lo)}"></div><div class="field"><label>Max reps</label><input type="number" name="hi" required min="1" max="100" value="${esc(e.hi)}"></div><div class="field"><label>Rest (sec)</label><input type="number" name="rest" min="0" max="600" value="${esc(e.rest)}"></div></div><div class="form-row"><div class="field"><label>Target muscle</label><input name="muscle" value="${esc(e.muscle)}" placeholder="Lats"></div><div class="field"><label>Difficulty</label><select name="difficulty">${['Beginner','Intermediate','Advanced'].map(x=>`<option ${x===e.difficulty?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Technique cue / mini description</label><textarea name="note">${esc(e.note)}</textarea></div><div class="field"><label>YouTube tutorial URL (optional; auto-searches by exercise if empty)</label><input type="url" name="video" value="${esc(e.video||'')}" placeholder="https://www.youtube.com/watch?v=..."></div><button type="submit" class="btn primary block">${icon('save')} Save exercise</button></form>`;modal(eid==='new'?`Add exercise to ${s.code}`:'Edit exercise',form)}
function saveExercise(ev){ev.preventDefault();const f=new FormData(ev.target);const s=S.sessions.find(x=>x.id===editSessionId);if(!s)return;let e=s.exercises.find(x=>x.id===editExId);if(!e){e={id:uid()};s.exercises.push(e)}e.name=String(f.get('name')).trim();e.sets=clamp(num(f.get('sets'),3),1,12);e.lo=clamp(num(f.get('lo'),8),1,100);e.hi=Math.max(e.lo,clamp(num(f.get('hi'),12),1,100));e.rest=clamp(num(f.get('rest'),90),0,600);e.muscle=String(f.get('muscle')).trim();e.difficulty=String(f.get('difficulty'));e.note=String(f.get('note')).trim();e.video=safeVideo(String(f.get('video')||youtubeSearch(e.name)),e.name);persist();closeDialog();render();notify('Exercise saved')}
function seriesSvg(data,unit='',height=215){const w=780,h=height,p={l:48,r:24,t:24,b:34};if(!data.length)return `<div class="empty"><strong>Nothing plotted yet.</strong>Add entries and your progress chart will appear here.</div>`;const vals=data.map(d=>num(d.value));let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<1){lo-=1;hi+=1}else{const pad=(hi-lo)*.15;lo-=pad;hi+=pad;}const X=i=>data.length===1?w/2:p.l+(i/(data.length-1))*(w-p.l-p.r),Y=v=>p.t+(hi-v)/(hi-lo)*(h-p.t-p.b);let grids='';for(let i=0;i<4;i++){let y=p.t+i*(h-p.t-p.b)/3, v=hi-i*(hi-lo)/3;grids+=`<line x1="${p.l}" y1="${y}" x2="${w-p.r}" y2="${y}" class="gridline"/><text x="${p.l-9}" y="${y+4}" text-anchor="end">${v.toFixed(1)}${unit}</text>`}const path=data.map((d,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(d.value).toFixed(1)).join(' ');const points=data.map((d,i)=>`<circle class="point" cx="${X(i)}" cy="${Y(d.value)}" r="5"><title>${esc(d.date)} — ${num(d.value).toFixed(1)}${esc(unit)}</title></circle>`).join('');let labels='';let idxs=[0,Math.floor((data.length-1)/2),data.length-1].filter((v,i,a)=>a.indexOf(v)===i);for(const i of idxs)labels+=`<text x="${X(i)}" y="${h-9}" text-anchor="middle">${fmtDate(data[i].date).replace(', 2026','')}</text>`;return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Trend line with ${data.length} data points">${grids}<path class="series" d="${path}"/>${points}${labels}</svg>`}
function renderProgress(){const sorted=S.measurements.toSorted((a,b)=>a.date.localeCompare(b.date));const latest=sorted.at(-1),latestWeight=sorted.filter(m=>m.weight!==''&&m.weight!=null).at(-1),latestWaist=sorted.filter(m=>m.waist!==''&&m.waist!=null).at(-1),first=sorted[0];const weightdata=sorted.filter(x=>x.weight!==''&&x.weight!==null&&x.weight!==undefined).map(x=>({date:x.date,value:num(x.weight)}));const waistdata=sorted.filter(x=>x.waist!==''&&x.waist!==null&&x.waist!==undefined).map(x=>({date:x.date,value:num(x.waist)}));const measures=progressMode==='weight'?weightdata:waistdata;const gymnames=[...new Set(S.logs.flatMap(l=>typeOfLog(l)==='gym'?(l.exercises||[]).map(e=>e.name):[]))].sort();if(!progressExercise||!gymnames.includes(progressExercise))progressExercise=gymnames[0]||'';const strength=S.logs.filter(x=>typeOfLog(x)==='gym').toSorted((a,b)=>a.date.localeCompare(b.date)).flatMap(l=>(l.exercises||[]).filter(e=>e.name===progressExercise).map(e=>({date:l.date,value:Math.max(0,...e.sets.filter(s=>s.done).map(s=>num(s.weight)))}))).filter(x=>x.value>0);
return `<div class="header-row"><div><div class="eyemark">BODY COMPOSITION + STRENGTH</div><h2>Track the details that matter</h2><p>Not just the scale. Waist, consistency, training performance and recovery.</p></div>${button(icon('plus')+' New measurement',"openMeasurement()",'primary sm')}</div><div class="grid cols3"><div class="card"><div class="eyebrow">CURRENT SCALE WEIGHT</div><div class="metric">${latestWeight?.weight??'~'+S.profile.referenceWeight}<span> kg</span></div><div class="metric-foot">${latestWeight?fmtDate(latestWeight.date):'Profile reference; add exact weigh-in'}</div></div><div class="card"><div class="eyebrow">WAIST AT NAVEL</div><div class="metric">${latestWaist?.waist||'—'}<span> cm</span></div><div class="metric-foot">Take measurement relaxed, same conditions</div></div><div class="card"><div class="eyebrow">PROTEIN TARGET</div><div class="metric">${esc(S.profile.protein)}<span> g / day</span></div><div class="metric-foot">Current personal goal, not an intake log</div></div></div>
<div class="grid cols2" style="margin-top:19px"><div class="card"><div class="card-head"><h3>Body trend</h3><div class="tabrow"><button class="seg ${progressMode==='weight'?'active':''}" onclick="progressMode='weight';render()">Weight</button><button class="seg ${progressMode==='waist'?'active':''}" onclick="progressMode='waist';render()">Waist</button></div></div>${seriesSvg(measures,progressMode==='weight'?'kg':'cm')}<div class="muted small">${measures.length>=2?'First: '+measures[0].value+' → latest: '+measures.at(-1).value+' ('+(measures.at(-1).value-measures[0].value>=0?'+':'')+(measures.at(-1).value-measures[0].value).toFixed(1)+')':'Trend builds as you log regular measurements.'}</div></div><div class="card"><div class="card-head"><h3>Strength trend</h3><div class="field" style="min-width:180px"><select onchange="progressExercise=this.value;render()"><option value="">${gymnames.length?'Choose exercise':'No completed gym sessions'}</option>${gymnames.map(n=>`<option ${n===progressExercise?'selected':''} value="${esc(n)}">${esc(n)}</option>`).join('')}</select></div></div>${seriesSvg(strength,'kg')}<div class="small muted">Top completed working-set weight by session (not an estimated 1RM).</div></div></div>
<div class="grid cols2" style="margin-top:19px"><div class="card"><div class="card-head"><h3>Measurements log</h3>${button('Add '+icon('plus'),"openMeasurement()",'sm')}</div>${sorted.length?sorted.toReversed().slice(0,12).map(m=>`<div class="list-row"><div class="grow"><strong>${fmtDate(m.date)}</strong><small>${m.weight!==''?m.weight+' kg':'— kg'} · ${m.waist!==''?m.waist+' cm waist':'— waist'}${m.notes?' · '+esc(m.notes.slice(0,70)):''}</small></div>${button(icon('edit'),`openMeasurement('${m.id}')`,'sm')}${button('×',`deleteMeasurement('${m.id}')`,'sm')}</div>`).join(''):'<div class="empty"><strong>Your first measurement is ready.</strong>Weight and waist are optional and can be logged on different days.</div>'}</div><div class="card"><div class="card-head"><h3>Progress principles</h3><span class="pill green">YOUR V-TAPER</span></div><div class="row-stat"><span class="muted">Track waist circumference</span><span class="value">weekly</span></div><div class="row-stat"><span class="muted">Track bodyweight</span><span class="value">trend</span></div><div class="row-stat"><span class="muted">Increase loads</span><span class="value">with form</span></div><div class="row-stat"><span class="muted">Primary growth</span><span class="value">lats · delts</span></div><p class="muted small" style="margin-top:16px">Use the same exercises and equipment when comparing weight trends. During your comeback, let technique and recovery set the pace.</p></div></div>`}
function openMeasurement(id=''){const m=S.measurements.find(x=>x.id===id)||{date:todayISO(),weight:'',waist:'',notes:''};modal(id?'Edit measurement':'Log measurement',`<form id="measure-form" onsubmit="saveMeasurement(event,'${id}')" style="display:grid;gap:15px"><div class="field"><label>Measurement date</label><input name="date" type="date" required value="${esc(m.date)}"></div><div class="form-row"><div class="field"><label>Bodyweight (kg)</label><input name="weight" type="number" min="25" max="300" step="0.1" inputmode="decimal" value="${esc(m.weight)}" placeholder="e.g. 91.2"></div><div class="field"><label>Waist at navel (cm)</label><input name="waist" type="number" min="40" max="200" step="0.1" inputmode="decimal" value="${esc(m.waist)}" placeholder="Optional"></div></div><div class="field"><label>Notes</label><textarea name="notes" placeholder="Morning, after travel, recovery, photo reference…">${esc(m.notes)}</textarea></div><button type="submit" class="btn primary block">${icon('save')} Save measurement</button></form>`)}
function saveMeasurement(ev,id){ev.preventDefault();const f=new FormData(ev.target),date=String(f.get('date')),weight=String(f.get('weight')).trim(),waist=String(f.get('waist')).trim();if(weight===''&&waist===''){notify('Enter weight or waist',true);return}let m=S.measurements.find(m=>m.id===id);if(!m){m={id:uid()};S.measurements.push(m)}m.date=date;m.weight=weight;m.waist=waist;m.notes=String(f.get('notes')).trim();persist();closeDialog();navigate('progress');notify('Measurement saved')}
function deleteMeasurement(id){if(!confirm('Delete this measurement?'))return;S.measurements=S.measurements.filter(x=>x.id!==id);persist();render()}
function renderHistory(){let logs=S.logs.toSorted((a,b)=>b.date.localeCompare(a.date));if(historyType!=='all')logs=logs.filter(l=>typeOfLog(l)===historyType);if(historyQuery)logs=logs.filter(l=>[l.sessionName,l.date,l.notes,l.wod].join(' ').toLowerCase().includes(historyQuery.toLowerCase()));return `<div class="header-row"><div><div class="eyemark">YOUR REAL TRAINING DATA</div><h2>Workout history</h2><p>Every finished session stays here even when you edit or delete its original template.</p></div>${button(icon('download')+' Export CSV',"exportCSV()",'sm')}</div><div class="grid cols3"><div class="card"><div class="eyebrow">TOTAL WORKOUTS</div><div class="metric">${S.logs.length}</div></div><div class="card"><div class="eyebrow">LIFTING SETS</div><div class="metric">${S.logs.reduce((v,l)=>v+totalSets(l),0)}</div></div><div class="card"><div class="eyebrow">TOTAL TRAINING TIME</div><div class="metric">${Math.round(S.logs.reduce((v,l)=>v+num(l.duration),0)/60)} <span>hours</span></div></div></div><div class="card" style="margin-top:18px"><div class="card-head"><div class="field" style="flex:1"><label>Search session or notes</label><input placeholder="Search your training history…" value="${esc(historyQuery)}" oninput="historyQuery=this.value;renderHistoryList()" id="history-search"></div><div class="field"><label>Type</label><select onchange="historyType=this.value;render()"><option value="all" ${historyType==='all'?'selected':''}>All</option><option value="gym" ${historyType==='gym'?'selected':''}>Gym</option><option value="crossfit" ${historyType==='crossfit'?'selected':''}>CrossFit</option></select></div></div><div id="history-list">${historyRows(logs)}</div></div>`}
function renderHistoryList(){const q=historyQuery.toLowerCase();let logs=S.logs.toSorted((a,b)=>b.date.localeCompare(a.date));if(historyType!=='all')logs=logs.filter(l=>typeOfLog(l)===historyType);if(q)logs=logs.filter(l=>[l.sessionName,l.date,l.notes,l.wod].join(' ').toLowerCase().includes(q));document.getElementById('history-list').innerHTML=historyRows(logs)}
function historyRows(logs){return logs.length?logs.map(l=>`<div class="list-row"><div style="width:45px;height:45px;border-radius:12px;background:#27382f;color:${typeOfLog(l)==='gym'?'var(--mint)':'var(--orange)'};display:grid;place-items:center">${icon(typeOfLog(l)==='gym'?'dumbbell':'clock')}</div><div class="grow"><strong>${esc(l.sessionName)}</strong><small>${fmtDate(l.date)} · ${num(l.duration)} min · ${typeOfLog(l)==='gym'?totalSets(l)+' completed sets':esc(l.score||'CrossFit class')}</small></div>${button('Details '+icon('arrow'),`showHistory('${l.id}')`,'sm')}</div>`).join(''):`<div class="empty"><strong>No sessions yet.</strong>Your completed sessions will show here — no sample workouts or fake PRs.</div>`}
function showHistory(id){const l=S.logs.find(x=>x.id===id);if(!l)return;editLogId=id;const sets=l.type==='gym'?(l.exercises||[]).map((e,i)=>`<div style="margin-bottom:18px"><h3 style="margin-bottom:6px">${esc(e.name)}</h3><div class="small muted" style="margin-bottom:8px">Completed sets can be corrected after the workout.</div><div class="set-table"><div class="set-line header"><span>SET</span><span>KG</span><span>REPS</span><span>RIR</span><span>DONE</span><span></span></div>${(e.sets||[]).map((s,j)=>`<div class="set-line"><div class="set-number">${j+1}</div><input type="number" step="0.5" min="0" value="${esc(s.weight)}" onchange="editHistorySet('${l.id}',${i},${j},'weight',this.value)"><input type="number" min="0" value="${esc(s.reps)}" onchange="editHistorySet('${l.id}',${i},${j},'reps',this.value)"><input type="number" min="0" value="${esc(s.rir)}" onchange="editHistorySet('${l.id}',${i},${j},'rir',this.value)"><input type="checkbox" aria-label="Set completed" ${s.done?'checked':''} onchange="editHistorySet('${l.id}',${i},${j},'done',this.checked)" style="width:22px;justify-self:center"><span></span></div>`).join('')}</div></div>`).join(''):`<div class="field"><label>WOD / movement description</label><textarea onchange="editHistoryField('${l.id}','wod',this.value)">${esc(l.wod)}</textarea></div><div class="form-row"><div class="field"><label>Score</label><input value="${esc(l.score)}" onchange="editHistoryField('${l.id}','score',this.value)"></div><div class="field"><label>Scaling</label><select onchange="editHistoryField('${l.id}','scale',this.value)">${['rx','scaled','skills'].map(x=>`<option value="${x}" ${l.scale===x?'selected':''}>${x}</option>`).join('')}</select></div></div>`;
modal('Session details',`<div class="form-row"><div class="field"><label>Session date</label><input type="date" value="${esc(l.date)}" onchange="editHistoryField('${l.id}','date',this.value)"></div><div class="field"><label>Duration (min)</label><input type="number" min="1" value="${esc(l.duration)}" onchange="editHistoryField('${l.id}','duration',this.value)"></div></div><div><div class="eyebrow">${esc(l.code)} · ${l.type==='gym'?'GYM':'CROSSFIT'}</div><h3 style="font-size:20px;margin:6px 0">${esc(l.sessionName)}</h3></div>${sets}<div class="field"><label>Notes</label><textarea onchange="editHistoryField('${l.id}','notes',this.value)">${esc(l.notes)}</textarea></div>`,`${button(icon('trash')+' Delete',`deleteLog('${l.id}')`,'danger sm')}${button('Done',"closeDialog();render()",'primary')}`)}
function editHistorySet(lid,ei,si,key,val){const l=S.logs.find(x=>x.id===lid),s=l?.exercises?.[ei]?.sets?.[si];if(!s)return;s[key]=val;persist()}
function editHistoryField(lid,key,val){const l=S.logs.find(x=>x.id===lid);if(!l)return;l[key]=val;persist()}
function deleteLog(id){if(!confirm('Permanently delete this completed workout?'))return;S.logs=S.logs.filter(l=>l.id!==id);persist();closeDialog();render();notify('Workout deleted')}
function download(filename,content,mime='application/octet-stream'){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function exportJSON(){const now=new Date().toISOString().slice(0,10);S.lastBackup=now;persist();download(`Badr_Training_OS_Backup_${now}.json`,JSON.stringify({app:'Badr Training OS',version:APP_VERSION,exportedAt:new Date().toISOString(),data:S},null,2),'application/json');render();notify('Complete backup exported — save it to Files or iCloud')}
function quoteCsv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(){const header=['Date','Workout','Type','Exercise','Set','Weight kg','Reps','RIR','Done','Duration min','Notes','WOD','Score'];const lines=[header.join(',')];for(const l of S.logs){if(l.type==='crossfit'){lines.push([l.date,l.sessionName,'CrossFit','','','','','','',l.duration,l.notes,l.wod,l.score].map(quoteCsv).join(','));continue}for(const e of l.exercises||[])for(let i=0;i<e.sets.length;i++){const s=e.sets[i];lines.push([l.date,l.sessionName,'Gym',e.name,i+1,s.weight,s.reps,s.rir,s.done?'yes':'no',l.duration,l.notes,'',''].map(quoteCsv).join(','))}}download('Badr_Training_OS_Workouts.csv',lines.join('\r\n'),'text/csv;charset=utf-8');notify('CSV exported')}
function importFromFile(input){const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result),data=parsed?.data||parsed;if(!data||data.schema!==1||!Array.isArray(data.sessions)||!Array.isArray(data.logs)||!Array.isArray(data.measurements)||!data.profile){notify('This is not a valid Badr Training OS backup',true);return;}if(!confirm('Restore this backup? This replaces current data. Export a backup of your current data first if you need it.'))return;S=data;persist();navigate('home');notify('Backup restored successfully')}catch(e){console.error(e);notify('Could not read that backup file',true)}finally{input.value=''}};reader.readAsText(file)}
function resetAll(){const ans=prompt('This deletes ALL logged workouts, plan edits and measurements on this device. Type RESET to confirm.');if(ans!=='RESET')return;S=seed();persist();navigate('home');notify('Tracker reset to the original new-program defaults')}
function updateProfile(ev){ev.preventDefault();const f=new FormData(ev.target);S.profile.displayName=String(f.get('displayName')).slice(0,60)||'Badr';S.profile.height=clamp(num(f.get('height'),190),100,230);S.profile.protein=clamp(num(f.get('protein'),160),60,350);S.profile.referenceWeight=clamp(num(f.get('referenceWeight'),92),40,250);S.profile.weekGoalGym=clamp(num(f.get('weekGoalGym'),4),1,7);S.profile.weekGoalCrossfit=clamp(num(f.get('weekGoalCrossfit'),2),1,7);persist();render();notify('Preferences updated')}
function renderSettings(){return `<div class="header-row"><div><div class="eyemark">PRIVATE · PORTABLE · FUTURE-PROOF</div><h2>Preferences & backups</h2><p>This is a brand-new tracker. Your program and all real workout records are yours.</p></div></div><div class="grid cols2"><div class="card"><div class="card-head"><h3>Your profile</h3><span class="pill green">CUSTOMIZED FOR BADR</span></div><form onsubmit="updateProfile(event)" style="display:grid;gap:14px"><div class="form-row"><div class="field"><label>Display name</label><input name="displayName" value="${esc(S.profile.displayName)}"></div><div class="field"><label>Height (cm)</label><input name="height" type="number" min="100" max="230" value="${esc(S.profile.height)}"></div></div><div class="form-row"><div class="field"><label>Protein target (g/day)</label><input name="protein" type="number" min="60" max="350" value="${esc(S.profile.protein)}"></div><div class="field"><label>Current reference weight (kg)</label><input name="referenceWeight" type="number" min="40" max="250" step="0.1" value="${esc(S.profile.referenceWeight)}"></div></div><div class="form-row"><div class="field"><label>Gym sessions / week</label><input name="weekGoalGym" type="number" min="1" max="7" value="${esc(S.profile.weekGoalGym)}"></div><div class="field"><label>CrossFit / week</label><input name="weekGoalCrossfit" type="number" min="1" max="7" value="${esc(S.profile.weekGoalCrossfit)}"></div></div><button type="submit" class="btn primary block">${icon('save')} Save preferences</button></form></div><div class="card"><div class="card-head"><h3>Data control</h3><span class="pill green">LOCAL STORAGE</span></div><p class="muted medium">Progress is stored automatically in this browser for this app's web address. No account, no subscription, no trackers. For peace of mind, export a complete backup regularly.</p><div class="grid" style="gap:10px;margin-top:20px">${button(icon('download')+' Download full JSON backup',"exportJSON()",'primary block')}${button(icon('download')+' Export workout CSV',"exportCSV()",'block')}<label class="btn block" style="cursor:pointer">${icon('upload')} Restore from JSON backup<input type="file" accept="application/json,.json" style="display:none" onchange="importFromFile(this)"></label></div><div class="guide" style="margin-top:18px"><strong>Upgrading later:</strong> Keep using the same website address and same app storage key. Updated app files do not erase your locally saved workouts. A JSON backup can also restore everything after device changes or browser storage loss.</div><p class="disclaimer" style="margin-top:12px">Last JSON backup: ${S.lastBackup?fmtDate(S.lastBackup):'Not yet exported'}</p></div></div>
<div class="grid cols2" style="margin-top:18px"><div class="card"><h3>First two weeks back</h3><p class="muted medium">After your long training break, reduce working sets and leave 2–3 reps in reserve. Enable or disable anytime. Existing workouts will not be changed.</p><div class="row-stat"><div><strong>Return-to-gym mode</strong><div class="small muted">${S.profile.reentry?'Active, around 65% of programmed sets':'Inactive, full programmed sets'}</div></div>${button(S.profile.reentry?'Enabled ✓':'Enable',"toggleReentry()",S.profile.reentry?'primary sm':'sm')}</div></div><div class="card"><h3>Reset</h3><p class="muted medium">Only use this if you want to start completely from scratch. It will erase everything saved to this browser — program edits, workout logs, measurements and unfinished sessions.</p>${button(icon('trash')+' Reset everything',"resetAll()",'danger sm')}<p class="disclaimer" style="margin-top:17px">Badr Training OS ${APP_VERSION} · All files work offline once installed. YouTube demonstrations require internet. No peptide dosing or medical functionality.</p></div></div>`}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('dialog-root').innerHTML)closeDialog()});
if(!localStorage.getItem(STORE_KEY))persist();
render();
if('serviceWorker'in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
